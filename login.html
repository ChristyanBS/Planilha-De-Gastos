<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Finanças AI</title>
    <link rel="icon" type="image/png" href="images/icons/favicon-32x32.png">
    <link rel="apple-touch-icon" href="images/icons/icon-192x192.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">

    <!-- ============================================= -->
    <!-- ===            LOGIN CSS                  === -->
    <!-- ============================================= -->
    <style>
        /* --- Reset & Base --- */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            /* Deep space gradient */
            background: linear-gradient(135deg, #000000 0%, #0f0b2e 50%, #1e1b4b 100%);
            position: relative;
        }

        /* Corner accent glows */
        body::before,
        body::after {
            content: '';
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.15;
            pointer-events: none;
            z-index: 0;
        }
        body::before {
            top: -200px;
            right: -200px;
            background: radial-gradient(circle, #6366f1, transparent 70%);
        }
        body::after {
            bottom: -250px;
            left: -200px;
            background: radial-gradient(circle, #4f46e5, transparent 70%);
        }

        /* --- Canvas Wave Layer --- */
        #canvas-wave {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* --- Glassmorphism Card --- */
        .login-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            margin: 1rem;
            padding: 2.8rem 2.4rem 2.2rem;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            box-shadow:
                0 4px 30px rgba(0, 0, 0, 0.5),
                0 0 80px rgba(79, 70, 229, 0.06),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
            animation: cardEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes cardEntrance {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.96);
                filter: blur(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0);
            }
        }

        /* --- Logo / Brand --- */
        .login-brand {
            text-align: center;
            margin-bottom: 2.2rem;
        }

        .login-brand-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
            border-radius: 18px;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            box-shadow: 0 6px 30px rgba(79, 70, 229, 0.35);
            margin-bottom: 1rem;
            font-size: 1.6rem;
            color: #fff;
            animation: iconFloat 3s ease-in-out infinite;
        }

        @keyframes iconFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .login-brand h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.6rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.02em;
        }

        .login-brand p {
            font-size: 0.88rem;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 0.35rem;
            font-weight: 400;
        }

        /* --- Futuristic Inputs --- */
        .input-group {
            position: relative;
            margin-bottom: 1.4rem;
        }

        .input-group .input-icon {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.25);
            transition: color 0.3s ease;
            width: 2.2rem;
            text-align: center;
        }

        .input-group input {
            width: 100%;
            padding: 0.85rem 0.5rem 0.85rem 2.4rem;
            background: transparent;
            border: none;
            border-bottom: 1.5px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            font-size: 0.92rem;
            font-weight: 400;
            outline: none;
            transition: border-color 0.35s ease, box-shadow 0.35s ease;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.2);
            font-weight: 300;
        }

        .input-group input:focus {
            border-bottom-color: #6366f1;
            box-shadow: 0 2px 12px rgba(99, 102, 241, 0.2);
        }

        .input-group input:focus + .input-underline {
            transform: scaleX(1);
        }

        .input-group input:focus ~ .input-icon {
            color: #818cf8;
        }

        /* Animated underline */
        .input-underline {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, #4f46e5, #6366f1, #818cf8);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            border-radius: 2px;
        }

        /* --- Primary Button (Gradient Glow) --- */
        .btn-login {
            width: 100%;
            padding: 0.85rem 1.5rem;
            margin-top: 0.5rem;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #4338ca, #4f46e5, #6366f1);
            background-size: 200% 200%;
            color: #ffffff;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-login::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 14px;
            background: linear-gradient(135deg, #4338ca, #4f46e5, #6366f1);
            opacity: 0;
            filter: blur(14px);
            transition: opacity 0.3s ease;
            z-index: -1;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow:
                0 8px 30px rgba(79, 70, 229, 0.4),
                0 0 40px rgba(79, 70, 229, 0.12);
            background-position: 100% 0;
        }

        .btn-login:hover::before {
            opacity: 0.5;
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login .btn-spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2.5px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin: 0 auto;
        }

        .btn-login.loading .btn-text { display: none; }
        .btn-login.loading .btn-spinner { display: block; }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* --- Error Message --- */
        .error-msg {
            text-align: center;
            font-size: 0.82rem;
            color: #ff6b6b;
            margin-top: 0.6rem;
            min-height: 1.2em;
        }

        /* --- Toggle Link --- */
        .toggle-link-area {
            text-align: center;
            margin-top: 1.3rem;
        }

        .toggle-link-area a {
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.82rem;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .toggle-link-area a:hover {
            color: #818cf8;
        }

        /* --- Separator --- */
        .separator {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 1.5rem 0;
        }

        .separator-line {
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.08);
        }

        .separator span {
            color: rgba(255, 255, 255, 0.2);
            font-size: 0.78rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        /* --- Google Button --- */
        .btn-google {
            width: 100%;
            padding: 0.75rem 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.7);
            font-family: 'Inter', sans-serif;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            transition: all 0.25s ease;
        }

        .btn-google:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.18);
            color: #ffffff;
            transform: translateY(-1px);
        }

        .btn-google .google-icon {
            font-size: 1rem;
            background: linear-gradient(135deg, #4285f4, #ea4335, #fbbc05, #34a853);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* --- View Transitions --- */
        .hidden { display: none !important; }

        .view-container {
            animation: viewFade 0.35s ease both;
        }

        @keyframes viewFade {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- Footer copyright --- */
        .login-footer {
            text-align: center;
            margin-top: 1.8rem;
            padding-top: 1.2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .login-footer span {
            font-size: 0.72rem;
            color: rgba(255, 255, 255, 0.15);
            font-weight: 400;
            letter-spacing: 0.04em;
        }

        /* --- Responsive --- */
        @media (max-width: 480px) {
            .login-card {
                margin: 0.75rem;
                padding: 2rem 1.6rem 1.6rem;
                border-radius: 20px;
            }
            .login-brand-icon {
                width: 50px;
                height: 50px;
                font-size: 1.3rem;
            }
            .login-brand h1 { font-size: 1.35rem; }
        }

        /* --- Scanline overlay (subtle) --- */
        .scanline-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(99, 102, 241, 0.008) 2px,
                rgba(99, 102, 241, 0.008) 4px
            );
        }

        /* --- Clean layout override (match app current visual) --- */
        body {
            background: #f3f4f6;
            overflow-y: auto;
            padding: 2rem 1rem;
        }

        body::before,
        body::after,
        #canvas-wave,
        .scanline-overlay,
        .login-brand-icon {
            display: none;
        }

        .login-card {
            max-width: 520px;
            margin: 0;
            padding: 2.2rem 2rem;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(15, 23, 42, 0.08);
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            animation: none;
        }

        .login-brand {
            margin-bottom: 1.8rem;
        }

        .login-brand h1 {
            color: #4338ca;
            font-size: 2rem;
            font-weight: 700;
        }

        .login-brand p {
            color: #334155;
            font-size: 1.1rem;
            margin-top: 0.2rem;
            font-family: 'Space Grotesk', sans-serif;
        }

        .input-group {
            margin-bottom: 1rem;
        }

        .input-group .input-icon,
        .input-underline {
            display: none;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.45rem;
            color: #1e293b;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: 'Space Grotesk', sans-serif;
        }

        .input-group input {
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            background: #ffffff;
            color: #334155;
            padding: 0.85rem 0.95rem;
            font-size: 1rem;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .input-group input::placeholder {
            color: #94a3b8;
            font-weight: 400;
        }

        .input-group input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.18);
        }

        .btn-login {
            margin-top: 1rem;
            border-radius: 10px;
            background: linear-gradient(135deg, #4f46e5, #4338ca);
            font-size: 1rem;
            font-weight: 700;
            box-shadow: none;
        }

        .btn-login:hover {
            transform: none;
            box-shadow: none;
            background-position: 0 0;
        }

        .btn-login::before {
            display: none;
        }

        .toggle-link-area a {
            color: #4f46e5;
            font-size: 0.95rem;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 500;
        }

        .separator-line {
            background: #cbd5e1;
        }

        .separator span {
            color: #64748b;
        }

        .btn-google {
            border: 1px solid #cbd5e1;
            background: #ffffff;
            color: #1e293b;
            font-size: 1rem;
            font-family: 'Space Grotesk', sans-serif;
            border-radius: 10px;
        }

        .btn-google:hover {
            background: #f8fafc;
            border-color: #94a3b8;
            color: #0f172a;
            transform: none;
        }

        .login-footer {
            border-top: 1px solid #e2e8f0;
        }

        .login-footer span {
            color: #94a3b8;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 1.6rem 1.2rem;
            }

            .login-brand h1 {
                font-size: 1.75rem;
            }

            .login-brand p,
            .btn-login,
            .btn-google,
            .toggle-link-area a {
                font-size: 0.95rem;
            }
        }
    </style>
</head>

<body>
    <!-- Canvas particle wave background -->
    <canvas id="canvas-wave"></canvas>

    <!-- Scanline overlay -->
    <div class="scanline-overlay"></div>

    <!-- ===== Login Card ===== -->
    <div class="login-card">

        <!-- Brand / Logo -->
        <div class="login-brand">
            <div class="login-brand-icon">
                <i class="fas fa-wallet"></i>
            </div>
            <h1>Acesse sua Conta</h1>
            <p>Bem-vindo de volta!</p>
        </div>

        <!-- ===== Login View ===== -->
        <div id="login-view" class="view-container">
            <div class="input-group">
                <label for="login-email">Email</label>
                <i class="fas fa-envelope input-icon"></i>
                <input type="email" id="login-email" placeholder="Seu email" autocomplete="email">
                <div class="input-underline"></div>
            </div>
            <div class="input-group">
                <label for="login-password">Senha</label>
                <i class="fas fa-lock input-icon"></i>
                <input type="password" id="login-password" placeholder="Senha" autocomplete="current-password">
                <div class="input-underline"></div>
            </div>
            <button id="login-btn" class="btn-login">
                <span class="btn-text">Entrar</span>
                <div class="btn-spinner"></div>
            </button>
            <p id="login-error" class="error-msg"></p>
        </div>

        <!-- ===== Signup View ===== -->
        <div id="signup-view" class="hidden view-container">
            <div class="input-group">
                <label for="signup-name">Nome</label>
                <i class="fas fa-user input-icon"></i>
                <input type="text" id="signup-name" placeholder="Como podemos te chamar?" autocomplete="name">
                <div class="input-underline"></div>
            </div>
            <div class="input-group">
                <label for="signup-email">Email</label>
                <i class="fas fa-envelope input-icon"></i>
                <input type="email" id="signup-email" placeholder="Seu email" autocomplete="email">
                <div class="input-underline"></div>
            </div>
            <div class="input-group">
                <label for="signup-password">Senha</label>
                <i class="fas fa-lock input-icon"></i>
                <input type="password" id="signup-password" placeholder="Senha (mínimo 6 caracteres)" autocomplete="new-password">
                <div class="input-underline"></div>
            </div>
            <button id="signup-btn" class="btn-login">
                <span class="btn-text">Criar Conta</span>
                <div class="btn-spinner"></div>
            </button>
            <p id="signup-error" class="error-msg"></p>
        </div>

        <!-- Toggle Link -->
        <div class="toggle-link-area">
            <a href="#" id="toggle-view-link">Não tem uma conta? <strong>Cadastre-se</strong></a>
        </div>

        <!-- Separator -->
        <div class="separator">
            <div class="separator-line"></div>
            <span>ou</span>
            <div class="separator-line"></div>
        </div>

        <!-- Google Login -->
        <button id="google-login-btn" class="btn-google">
            <i class="fab fa-google google-icon"></i>
            Entrar com Google
        </button>

        <!-- Footer -->
        <div class="login-footer">
            <span>&copy; 2026 Finanças &mdash; Powered by AI</span>
        </div>
    </div>

    <!-- ============================================= -->
    <!-- ===      CANVAS WAVE ANIMATION SCRIPT     === -->
    <!-- ============================================= -->
    <script>
    (function() {
        const canvas = document.getElementById('canvas-wave');
        const ctx = canvas.getContext('2d');

        let width, height;
        let cols, rows;
        const SPACING = 38;
        const DOT_RADIUS = 1.3;
        const LINE_MAX_DIST = 65;
        let time = 0;
        let mouse = { x: -9999, y: -9999 };
        const MOUSE_RADIUS = 160;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            cols = Math.ceil(width / SPACING) + 2;
            rows = Math.ceil(height / SPACING) + 2;
        }

        window.addEventListener('resize', resize);
        resize();

        // Track mouse for subtle interaction
        document.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });
        document.addEventListener('mouseleave', () => {
            mouse.x = -9999;
            mouse.y = -9999;
        });

        function animate() {
            ctx.clearRect(0, 0, width, height);
            time += 0.004;

            const points = [];

            // Generate wave-displaced grid points
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const baseX = c * SPACING - SPACING;
                    const baseY = r * SPACING - SPACING;

                    // Multi-layered wave displacement
                    const wave1 = Math.sin(baseX * 0.008 + time * 1.5) * 12;
                    const wave2 = Math.cos(baseY * 0.006 + time * 1.2) * 10;
                    const wave3 = Math.sin((baseX + baseY) * 0.005 + time * 0.8) * 8;
                    const wave4 = Math.cos(baseX * 0.003 - time * 0.5) * Math.sin(baseY * 0.004 + time) * 6;

                    const dx = wave1 + wave3 * 0.5;
                    const dy = wave2 + wave4 * 0.5;

                    const x = baseX + dx;
                    const y = baseY + dy;

                    // Depth-based opacity (brighter near center-bottom, dimmer at edges)
                    const cx = width * 0.5;
                    const cy = height * 0.6;
                    const distCenter = Math.sqrt((x - cx) ** 2 + (y - cy) ** 2);
                    const maxDist = Math.sqrt(cx ** 2 + cy ** 2);
                    let alpha = 0.12 + 0.2 * (1 - distCenter / maxDist);

                    // Mouse proximity boost
                    const distMouse = Math.sqrt((x - mouse.x) ** 2 + (y - mouse.y) ** 2);
                    if (distMouse < MOUSE_RADIUS) {
                        const boost = 1 - distMouse / MOUSE_RADIUS;
                        alpha += boost * 0.35;
                    }

                    alpha = Math.max(0.04, Math.min(alpha, 0.5));

                    points.push({ x, y, alpha, baseX, baseY });
                }
            }

            // Draw connections
            ctx.lineWidth = 0.5;
            for (let i = 0; i < points.length; i++) {
                const a = points[i];
                // Only check neighbors (right, below, diagonal) to avoid O(n²)
                const neighbors = [i + 1, i + cols, i + cols + 1, i + cols - 1];
                for (const j of neighbors) {
                    if (j >= points.length) continue;
                    const b = points[j];
                    const dist = Math.sqrt((a.x - b.x) ** 2 + (a.y - b.y) ** 2);
                    if (dist < LINE_MAX_DIST) {
                        const lineAlpha = Math.min(a.alpha, b.alpha) * (1 - dist / LINE_MAX_DIST) * 0.5;
                        ctx.strokeStyle = `rgba(99, 102, 241, ${lineAlpha})`;
                        ctx.beginPath();
                        ctx.moveTo(a.x, a.y);
                        ctx.lineTo(b.x, b.y);
                        ctx.stroke();
                    }
                }
            }

            // Draw dots
            for (const p of points) {
                // Slight color variation
                const hue = 240 + Math.sin(p.baseX * 0.01 + time) * 10;
                ctx.fillStyle = `hsla(${hue}, 80%, 65%, ${p.alpha})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, DOT_RADIUS, 0, Math.PI * 2);
                ctx.fill();
            }

            requestAnimationFrame(animate);
        }

        animate();
    })();
    </script>
