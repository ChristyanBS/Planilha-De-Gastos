<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login â€” FinanÃ§as AI</title>
    <link rel="icon" type="image/png" href="images/icons/favicon-32x32.png">
    <link rel="apple-touch-icon" href="images/icons/icon-192x192.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">

    <!-- ============================================= -->
    <!-- ===            LOGIN CSS                  === -->
    <!-- ============================================= -->
    <style>
        /* ============================================= */
        /* === LOGIN PAGE â€” PROFESSIONAL DARK THEME  === */
        /* ============================================= */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg:          #07090e;
            --surface:     #0c1018;
            --card:        #0f1520;
            --card-border: rgba(255,255,255,0.07);
            --text:        #dde2ee;
            --text-dim:    #7e8da4;
            --text-muted:  #3f4f65;
            --accent:      #4a7cf7;
            --accent-glow: rgba(74,124,247,0.14);
            --r-card:      22px;
            --r-input:     10px;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* --- Geometric SVG Background --- */
        .geo-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }
        .geo-shape {
            position: absolute;
            opacity: 0; /* GSAP reveals */
        }
        .geo-1 { width: 560px; height: 560px; top: -140px; right: -80px; }
        .geo-2 { width: 380px; height: 380px; bottom: -100px; left: -60px; }
        .geo-3 { width: 680px; height: 680px; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .geo-4 { width: 220px; height: 220px; top: 12%; left: 7%; }

        /* --- Cinematic Transition Overlay --- */
        #login-transition-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 200;
            pointer-events: none;
            opacity: 0;
        }

        /* --- Glassmorphism Card --- */
        .login-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 430px;
            margin: 1rem;
            padding: 2.8rem 2.5rem 2.3rem;
            background: var(--card);
            border: 0.5px solid var(--card-border);
            border-radius: var(--r-card);
            box-shadow: 0 12px 60px rgba(0,0,0,0.7), 0 2px 12px rgba(0,0,0,0.5),
                        inset 0 0.5px 0 rgba(255,255,255,0.06);
            opacity: 0; /* GSAP handles entry */
        }

        /* --- Brand / Logo --- */
        .login-brand { text-align: center; margin-bottom: 2rem; }

        .login-brand-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 52px;
            border-radius: 13px;
            background: var(--accent-glow);
            border: 0.5px solid rgba(74,124,247,0.28);
            margin-bottom: 1.1rem;
            font-size: 1.2rem;
            color: var(--accent);
        }

        .login-brand h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.025em;
            min-height: 1.85rem; /* reserve space for TextPlugin */
        }

        .login-brand p {
            font-size: 0.83rem;
            color: var(--text-muted);
            margin-top: 0.3rem;
        }

        /* --- Inputs --- */
        .input-group { margin-bottom: 1rem; }

        .input-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-dim);
            margin-bottom: 0.45rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 0.85rem;
            font-size: 0.78rem;
            color: var(--text-muted);
            pointer-events: none;
            transition: color 0.25s;
        }

        .input-wrapper input {
            width: 100%;
            padding: 0.78rem 0.9rem 0.78rem 2.35rem;
            background: rgba(255,255,255,0.03);
            border: 0.5px solid rgba(255,255,255,0.09);
            border-radius: var(--r-input);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
        }

        .input-wrapper input::placeholder { color: var(--text-muted); font-size: 0.88rem; }

        .input-wrapper input:focus {
            background: rgba(74,124,247,0.05);
            border-color: rgba(74,124,247,0.45);
            box-shadow: 0 0 0 3px rgba(74,124,247,0.09);
        }

        .input-wrapper:has(input:focus) i { color: var(--accent); }

        /* --- Button --- */
        .btn-login {
            width: 100%;
            padding: 0.82rem;
            margin-top: 0.4rem;
            background: var(--accent);
            border: none;
            border-radius: var(--r-input);
            color: #fff;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.92rem;
            font-weight: 600;
            letter-spacing: 0.01em;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
            position: relative;
        }

        .btn-login:hover {
            background: #3a6ce0;
            box-shadow: 0 4px 22px rgba(74,124,247,0.32);
            transform: translateY(-1px);
        }

        .btn-login:active { transform: translateY(0); }

        .btn-login .btn-spinner {
            display: none;
            width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,0.35);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.65s linear infinite;
            margin: 0 auto;
        }

        .btn-login.loading .btn-text  { display: none; }
        .btn-login.loading .btn-spinner { display: block; }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* --- Error --- */
        .error-msg {
            font-size: 0.79rem;
            color: #e06060;
            text-align: center;
            margin-top: 0.45rem;
            min-height: 1.1em;
        }

        /* --- Toggle Link --- */
        .toggle-link-area { text-align: center; margin-top: 1.1rem; }
        .toggle-link-area a {
            font-size: 0.82rem;
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
        }
        .toggle-link-area a:hover { color: var(--accent); }
        .toggle-link-area strong { color: var(--accent); font-weight: 600; }

        /* --- Separator --- */
        .separator { display: flex; align-items: center; gap: 0.8rem; margin: 1.2rem 0; }
        .separator-line { flex: 1; height: 0.5px; background: rgba(255,255,255,0.07); }
        .separator span { color: var(--text-muted); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; }

        /* --- Google Button --- */
        .btn-google {
            width: 100%;
            padding: 0.72rem;
            background: rgba(255,255,255,0.03);
            border: 0.5px solid rgba(255,255,255,0.1);
            border-radius: var(--r-input);
            color: var(--text-dim);
            font-family: 'Inter', sans-serif;
            font-size: 0.88rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            transition: background 0.2s, border-color 0.2s, color 0.2s;
        }
        .btn-google:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.16); color: var(--text); }

        .btn-google .google-icon {
            font-size: 0.95rem;
            background: linear-gradient(135deg, #4285f4, #ea4335, #fbbc05, #34a853);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* --- View Transitions --- */
        .hidden { display: none !important; }

        .view-container {
            animation: viewFade 0.35s ease both;
        }

        @keyframes viewFade {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- Footer copyright --- */
        .login-footer {
            text-align: center;
            margin-top: 1.8rem;
            padding-top: 1.2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .login-footer span {
            font-size: 0.72rem;
            color: rgba(255, 255, 255, 0.15);
            font-weight: 400;
            letter-spacing: 0.04em;
        }

        /* --- Responsive --- */
        @media (max-width: 480px) {
            .login-card {
                margin: 0.75rem;
                padding: 2rem 1.6rem 1.6rem;
                border-radius: 20px;
            }
            .login-brand-icon {
                width: 50px;
                height: 50px;
                font-size: 1.3rem;
            }
            .login-brand h1 { font-size: 1.35rem; }
        }

        /* --- Scanline overlay (subtle) --- */
        .scanline-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(99, 102, 241, 0.008) 2px,
                rgba(99, 102, 241, 0.008) 4px
            );
        }

        /* --- Footer --- */
        .login-footer {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 0.5px solid rgba(255,255,255,0.06);
        }
        .login-footer span { font-size: 0.7rem; color: var(--text-muted); letter-spacing: 0.04em; }

        /* --- Utilities --- */
        .hidden { display: none !important; }
        .view-container { animation: viewFade 0.3s ease both; }
        @keyframes viewFade {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* --- Responsive --- */
        @media (max-width: 480px) {
            .login-card { padding: 2rem 1.5rem 1.8rem; margin: 0.5rem; }
            .geo-1 { width: 320px; height: 320px; }
            .geo-3 { width: 380px; height: 380px; }
        }
    </style>
</head>


<body>
    <!-- ======================================= -->
    <!-- === GEOMETRIC SVG BACKGROUND        === -->
    <!-- ======================================= -->
    <div class="geo-bg" aria-hidden="true">
        <!-- Shape 1: Large triangle â€” top-right -->
        <svg class="geo-shape geo-1" viewBox="0 0 560 560" fill="none" xmlns="http://www.w3.org/2000/svg">
            <polygon points="280,35 540,510 20,510" stroke="rgba(74,124,247,0.10)" stroke-width="1"/>
            <polygon points="280,90 490,470 70,470"  stroke="rgba(74,124,247,0.05)" stroke-width="1"/>
        </svg>
        <!-- Shape 2: Rotated rectangle â€” bottom-left -->
        <svg class="geo-shape geo-2" viewBox="0 0 380 380" fill="none">
            <rect x="35" y="35" width="310" height="310" rx="44" stroke="rgba(255,255,255,0.07)" stroke-width="0.8" transform="rotate(24 190 190)"/>
            <rect x="70" y="70" width="240" height="240" rx="32" stroke="rgba(255,255,255,0.04)" stroke-width="0.8" transform="rotate(24 190 190)"/>
        </svg>
        <!-- Shape 3: Concentric circles â€” center -->
        <svg class="geo-shape geo-3" viewBox="0 0 680 680" fill="none">
            <circle cx="340" cy="340" r="280" stroke="rgba(74,124,247,0.07)" stroke-width="1"/>
            <circle cx="340" cy="340" r="200" stroke="rgba(74,124,247,0.045)" stroke-width="1"/>
            <circle cx="340" cy="340" r="118" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
        </svg>
        <!-- Shape 4: Thin crosshair â€” top-left -->
        <svg class="geo-shape geo-4" viewBox="0 0 220 220" fill="none">
            <line x1="0" y1="110" x2="220" y2="110" stroke="rgba(255,255,255,0.06)" stroke-width="0.6"/>
            <line x1="110" y1="0" x2="110" y2="220" stroke="rgba(255,255,255,0.06)" stroke-width="0.6"/>
            <circle cx="110" cy="110" r="28" stroke="rgba(74,124,247,0.10)" stroke-width="0.8"/>
            <circle cx="110" cy="110" r="5" fill="rgba(74,124,247,0.18)"/>
        </svg>
    </div>

    <!-- Cinematic transition overlay -->
    <div id="login-transition-overlay" aria-hidden="true"></div>

    <!-- ======================================= -->
    <!-- === LOGIN CARD                      === -->
    <!-- ======================================= -->
    <div class="login-card" id="login-card">

        <!-- Brand -->
        <div class="login-brand">

                <i class="fas fa-chart-line"></i>
            </div>
            <h1 id="brand-title"></h1>
            <p id="brand-subtitle">Sistema de GestÃ£o Financeira</p>
        </div>

        <!-- ===== Login View ===== -->
        <div id="login-view" class="view-container">
            <div class="input-group" id="field-email">
                <label for="login-email">Email</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="login-email" placeholder="seu@email.com" autocomplete="email">
                </div>
            </div>
            <div class="input-group" id="field-password">
                <label for="login-password">Senha</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="login-password" placeholder="â€¢â€¢â€¢â€¢â€¢â€¢â€¢â€¢" autocomplete="current-password">

            </div>

                <span class="btn-text">Entrar</span>

        </div>

        <!-- ===== Signup View ===== -->
        <div id="signup-view" class="hidden view-container">
            <div class="input-group">
                <label for="signup-name">Nome completo</label>
                <div class="input-wrapper">
                    <i class="fas fa-user"></i>
                    <input type="text" id="signup-name" placeholder="Como podemos te chamar?" autocomplete="name">
                </div>
            </div>
            <div class="input-group">
                <label for="signup-email">Email</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="signup-email" placeholder="seu@email.com" autocomplete="email">
                </div>
            </div>
            <div class="input-group">
                <label for="signup-password">Senha</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="signup-password" placeholder="MÃ­nimo 6 caracteres" autocomplete="new-password">

    <!-- ======================================= -->
    <!-- === GSAP + TEXTPLUGIN               === -->
    <!-- ======================================= -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/TextPlugin.min.js"></script>
    <script>
    (function () {
        gsap.registerPlugin(TextPlugin);

        // ===================================================
        // 1. GEOMETRIC BACKGROUND â€” slow parallax + float
        // ===================================================
        const shapes = document.querySelectorAll('.geo-shape');

        // Initial reveal
        gsap.to(shapes, { opacity: 1, duration: 2.5, stagger: 0.5, ease: 'power2.out' });

        // Continuous animations (different phase per shape)
        gsap.to('.geo-1', { y: -32, x:  14, rotation:  7, duration: 20, repeat: -1, yoyo: true, ease: 'sine.inOut' });
        gsap.to('.geo-2', { y:  28, x: -16, rotation: -5, duration: 26, repeat: -1, yoyo: true, ease: 'sine.inOut', delay: 2 });
        gsap.to('.geo-3', { scale: 1.06, rotation: 4, duration: 18, repeat: -1, yoyo: true, ease: 'sine.inOut', delay: 1, transformOrigin: 'center center' });
        gsap.to('.geo-4', { y: 22, x: 8, duration: 14, repeat: -1, yoyo: true, ease: 'sine.inOut', delay: 3 });

        // ===================================================
        // 2. CARD ASSEMBLY â€” cinematic entrance sequence
        // ===================================================
        const card        = document.getElementById('login-card');
        const brandIcon   = document.getElementById('brand-icon');
        const brandTitle  = document.getElementById('brand-title');
        const brandSub    = document.getElementById('brand-subtitle');
        const fEmail      = document.getElementById('field-email');
        const fPass       = document.getElementById('field-password');
        const loginBtn    = document.getElementById('login-btn');
        const toggleArea  = document.querySelector('.toggle-link-area');
        const separator   = document.querySelector('.separator');
        const googleBtn   = document.getElementById('google-login-btn');
        const footer      = document.querySelector('.login-footer');

        // Starting state
        gsap.set(card, { y: 22, scale: 0.91 });
        gsap.set([brandIcon, brandTitle, brandSub, fEmail, fPass, loginBtn,
                  toggleArea, separator, googleBtn, footer], { opacity: 0, y: 18 });
        gsap.set(brandIcon, { scale: 0.65 });

        // Assembly timeline
        const tl = gsap.timeline({ delay: 0.15 });

        // Card materialises
        tl.to(card, { opacity: 1, y: 0, scale: 1, duration: 1.1, ease: 'expo.out' });

        // Brand icon pops in
        tl.to(brandIcon, { opacity: 1, scale: 1, y: 0, duration: 0.75, ease: 'back.out(1.8)' }, '-=0.6');

        // Title: TextPlugin letter-by-letter reveal
        tl.to(brandTitle, { opacity: 1, y: 0, duration: 0.3 }, '-=0.25');
        tl.to(brandTitle, {
            text: { value: 'Bemâ€‘vindo de volta', delimiter: '' },
            duration: 1.1,
            ease: 'none'
        }, '<');

        // Subtitle
        tl.to(brandSub, { opacity: 1, y: 0, duration: 0.55, ease: 'expo.out' }, '-=0.5');

        // Email field
        tl.to(fEmail,   { opacity: 1, y: 0, duration: 0.55, ease: 'expo.out' }, '-=0.2');
        // Password field
        tl.to(fPass,    { opacity: 1, y: 0, duration: 0.55, ease: 'expo.out' }, '-=0.35');
        // Submit button
        tl.to(loginBtn, { opacity: 1, y: 0, duration: 0.5,  ease: 'expo.out' }, '-=0.3');
        // Secondary elements stagger
        tl.to([toggleArea, separator, googleBtn, footer], {
            opacity: 1, y: 0, duration: 0.45, stagger: 0.07, ease: 'power3.out'
        }, '-=0.15');

        // ===================================================
        // 3. LOGIN SUCCESS TRANSITION â€” cinematic wipe
        // ===================================================
        window.playLoginSuccessTransition = function (onComplete) {
            const overlay = document.getElementById('login-transition-overlay');
            const exitTl  = gsap.timeline({ onComplete });

            // Card scales up and blurs out
            exitTl.to(card, {
                scale: 1.06, opacity: 0,
                filter: 'blur(10px)',
                duration: 0.55, ease: 'power3.in'
            });
            // Background shapes fade
            exitTl.to(shapes, {
                opacity: 0, duration: 0.4, stagger: 0.05, ease: 'power2.in'
            }, '-=0.3');
            // Overlay sweeps to full black
            exitTl.to(overlay, {
                opacity: 1, duration: 0.5, ease: 'power3.in'
            }, '-=0.25');
        };

        // ===================================================
        // 4. SIGNUP VIEW TRANSITION (reveal fields)
        // ===================================================
        document.addEventListener('DOMContentLoaded', function () {
            const toggleLink = document.getElementById('toggle-view-link');
            if (!toggleLink) return;
            toggleLink.addEventListener('click', function () {
                const nameField = document.getElementById('signup-view');
                if (nameField && !nameField.classList.contains('hidden')) {
                    gsap.fromTo(
                        nameField.querySelectorAll('.input-group, .btn-login'),
                        { opacity: 0, y: 14 },
                        { opacity: 1, y: 0, duration: 0.5, stagger: 0.09, ease: 'expo.out', delay: 0.05 }
                    );
                }
            });
        });

    }());
    </script>

    <!-- Post-auth: wire cinematic redirect -->
    <script>
    window.onLoginSuccess = function () {
        if (typeof window.playLoginSuccessTransition === 'function') {
            window.playLoginSuccessTransition(function () {
                window.location.href = 'index.html';
            });
        } else {
            window.location.href = 'index.html';
        }
    };
