<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Finanças AI</title>
    <link rel="icon" type="image/png" href="images/icons/favicon-32x32.png">
    <link rel="apple-touch-icon" href="images/icons/icon-192x192.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after { box-sizing: border-box; }

        :root {
            --bg-0: #05070b;
            --bg-1: #0a101a;
            --bg-2: #111b2e;
            --card: rgba(13, 21, 36, 0.72);
            --card-border: rgba(255, 255, 255, 0.11);
            --txt: #e5ecfb;
            --txt-dim: #9dafd0;
            --txt-muted: #5d7194;
            --accent: #4f7cff;
            --accent-2: #12d6ff;
            --accent-3: #8e7dff;
            --danger: #f07070;
            --radius: 22px;
            --radius-sm: 12px;
        }

        html, body {
            margin: 0;
            min-height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            color: var(--txt);
            background:
                radial-gradient(1200px 700px at 15% 10%, rgba(79, 124, 255, 0.16), transparent 55%),
                radial-gradient(900px 500px at 85% 85%, rgba(18, 214, 255, 0.12), transparent 55%),
                linear-gradient(140deg, var(--bg-0), var(--bg-1) 45%, var(--bg-2));
        }

        .scene {
            position: fixed;
            inset: 0;
            perspective: 1400px;
            overflow: hidden;
        }

        #bg-particles {
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }

        .grid-overlay,
        .scan-overlay,
        .vignette {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .grid-overlay {
            z-index: 2;
            opacity: 0.33;
            background:
                linear-gradient(rgba(146, 176, 255, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(146, 176, 255, 0.05) 1px, transparent 1px);
            background-size: 62px 62px;
            mask-image: radial-gradient(ellipse at center, black 45%, transparent 100%);
        }

        .scan-overlay {
            z-index: 3;
            background: repeating-linear-gradient(
                0deg,
                rgba(255,255,255,0.0),
                rgba(255,255,255,0.0) 2px,
                rgba(80,130,255,0.04) 2px,
                rgba(80,130,255,0.04) 4px
            );
        }

        .vignette {
            z-index: 4;
            background: radial-gradient(circle at center, transparent 45%, rgba(3, 5, 8, 0.72) 100%);
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(3px);
            opacity: 0.45;
            pointer-events: none;
            z-index: 1;
        }

        .orb-1 { width: 340px; height: 340px; left: -90px; top: -120px; background: radial-gradient(circle, rgba(79,124,255,0.7), transparent 70%); }
        .orb-2 { width: 300px; height: 300px; right: -90px; bottom: -100px; background: radial-gradient(circle, rgba(18,214,255,0.65), transparent 70%); }
        .orb-3 { width: 240px; height: 240px; right: 14%; top: 8%; background: radial-gradient(circle, rgba(142,125,255,0.6), transparent 70%); }

        .login-wrap {
            position: relative;
            z-index: 6;
            width: 100%;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 1rem;
        }

        .login-card {
            width: min(460px, 94vw);
            position: relative;
            border-radius: var(--radius);
            border: 1px solid var(--card-border);
            background: linear-gradient(160deg, rgba(255,255,255,0.09), rgba(255,255,255,0.03) 42%, rgba(255,255,255,0.02));
            box-shadow:
                0 40px 80px rgba(0,0,0,0.55),
                0 10px 28px rgba(0, 25, 80, 0.35),
                inset 0 1px 0 rgba(255,255,255,0.2);
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
            padding: 2rem 1.9rem 1.55rem;
            transform-style: preserve-3d;
            overflow: hidden;
        }

        .login-card::before {
            content: "";
            position: absolute;
            inset: -140% -50%;
            background: conic-gradient(from 0deg,
                transparent 0deg,
                rgba(79,124,255,0.15) 45deg,
                transparent 95deg,
                rgba(18,214,255,0.15) 145deg,
                transparent 205deg,
                rgba(142,125,255,0.14) 255deg,
                transparent 360deg);
            animation: spin 14s linear infinite;
            pointer-events: none;
            opacity: 0.6;
        }

        .login-card-inner {
            position: relative;
            z-index: 1;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .brand {
            text-align: center;
            margin-bottom: 1.45rem;
        }

        .brand-badge {
            width: 58px;
            height: 58px;
            margin: 0 auto 1rem;
            border-radius: 15px;
            display: grid;
            place-items: center;
            color: #ffffff;
            font-size: 1.2rem;
            background: linear-gradient(145deg, rgba(79,124,255,0.95), rgba(18,214,255,0.78));
            box-shadow: 0 12px 28px rgba(35, 90, 220, 0.46);
        }

        .brand-badge-logo {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            object-fit: cover;
            box-shadow: 0 6px 14px rgba(12, 26, 58, 0.35);
        }

        .brand-title {
            margin: 0;
            min-height: 2.2rem;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.65rem;
            letter-spacing: -0.03em;
            font-weight: 700;
            color: #f5f8ff;
        }

        .brand-subtitle {
            margin: 0.32rem 0 0;
            font-size: 0.83rem;
            letter-spacing: 0.03em;
            color: var(--txt-dim);
        }

        .view-stack {
            position: relative;
            min-height: 270px;
        }

        .view {
            width: 100%;
        }

        .hidden { display: none !important; }

        .input-group { margin-bottom: 0.85rem; }

        .input-group label {
            display: block;
            margin-bottom: 0.42rem;
            font-size: 0.73rem;
            font-weight: 600;
            letter-spacing: 0.09em;
            text-transform: uppercase;
            color: var(--txt-dim);
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap i {
            position: absolute;
            left: 0.86rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--txt-muted);
            font-size: 0.8rem;
            transition: color 0.25s ease;
            pointer-events: none;
        }

        .input-wrap input {
            width: 100%;
            border: 1px solid rgba(255,255,255,0.14);
            border-radius: var(--radius-sm);
            background: rgba(6, 11, 20, 0.65);
            color: #f0f5ff;
            padding: 0.82rem 0.85rem 0.82rem 2.32rem;
            outline: none;
            font-size: 0.9rem;
            transition: border-color 0.22s, box-shadow 0.22s, transform 0.2s, background 0.2s;
        }

        .input-wrap input::placeholder { color: #6f84ac; }

        .input-wrap input:focus {
            border-color: rgba(79,124,255,0.74);
            box-shadow: 0 0 0 3px rgba(79,124,255,0.18), 0 10px 24px rgba(10, 38, 100, 0.2);
            background: rgba(10, 16, 28, 0.8);
            transform: translateY(-1px);
        }

        .input-wrap:has(input:focus) i { color: #8cc5ff; }

        .btn-login,
        .btn-google {
            width: 100%;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: transform 0.18s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        .btn-login {
            margin-top: 0.35rem;
            padding: 0.86rem;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.93rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            color: #fff;
            background: linear-gradient(145deg, #5688ff, #2f66ea);
            box-shadow: 0 12px 30px rgba(32, 86, 220, 0.5);
            position: relative;
            overflow: hidden;
        }

        .btn-login::before {
            content: "";
            position: absolute;
            left: -120%;
            top: 0;
            width: 70%;
            height: 100%;
            background: linear-gradient(100deg, transparent, rgba(255,255,255,0.45), transparent);
            transform: skewX(-18deg);
        }

        .btn-login:hover { transform: translateY(-1px); }
        .btn-login:active { transform: translateY(0); }

        .btn-login .btn-spinner {
            display: none;
            width: 17px;
            height: 17px;
            border: 2px solid rgba(255, 255, 255, 0.45);
            border-top-color: #fff;
            border-radius: 50%;
            margin: 0 auto;
            animation: spinner 0.72s linear infinite;
        }

        .btn-login.loading .btn-text { display: none; }
        .btn-login.loading .btn-spinner { display: block; }

        @keyframes spinner { to { transform: rotate(360deg); } }

        .error-msg {
            min-height: 1.2em;
            margin-top: 0.38rem;
            font-size: 0.8rem;
            text-align: center;
            color: var(--danger);
        }

        .toggle-link-area {
            text-align: center;
            margin-top: 0.86rem;
        }

        .toggle-link-area a {
            text-decoration: none;
            color: var(--txt-dim);
            font-size: 0.83rem;
            transition: color 0.2s ease;
        }

        .toggle-link-area a:hover { color: #b8ceff; }
        .toggle-link-area strong { color: #9cc0ff; }

        .separator {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            margin: 1rem 0;
        }

        .separator-line {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent);
        }

        .separator span {
            font-size: 0.7rem;
            letter-spacing: 0.13em;
            color: #7f94bb;
            text-transform: uppercase;
        }

        .btn-google {
            padding: 0.78rem;
            font-size: 0.88rem;
            color: #d2dfff;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.15);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.55rem;
        }

        .btn-google:hover {
            transform: translateY(-1px);
            background: rgba(255,255,255,0.11);
            box-shadow: 0 10px 20px rgba(0,0,0,0.25);
        }

        .google-icon {
            background: linear-gradient(145deg, #4285F4, #EA4335, #FBBC05, #34A853);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 1rem;
        }

        .login-footer {
            margin-top: 1.25rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(255,255,255,0.08);
            text-align: center;
            color: #6f83aa;
            font-size: 0.72rem;
            letter-spacing: 0.05em;
        }

        #login-transition-overlay {
            position: fixed;
            inset: 0;
            z-index: 50;
            pointer-events: none;
            opacity: 0;
            background:
                radial-gradient(900px 500px at 50% 50%, rgba(79,124,255,0.26), transparent 65%),
                linear-gradient(130deg, #03050a, #060a12 45%, #091022);
        }

        @media (max-width: 500px) {
            .login-card {
                width: min(95vw, 460px);
                padding: 1.75rem 1.2rem 1.25rem;
            }
            .brand-title { font-size: 1.45rem; min-height: 2rem; }
            .view-stack { min-height: 290px; }
        }
    </style>
</head>
<body>
    <div class="scene" id="scene">
        <canvas id="bg-particles"></canvas>
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="grid-overlay"></div>
        <div class="scan-overlay"></div>
        <div class="vignette"></div>
    </div>

    <div class="login-wrap">
        <div class="login-card" id="login-card">
            <div class="login-card-inner">
                <div class="brand">
                    <div class="brand-badge" id="brand-badge">
                        <img src="images/icons/icon-192x192.png" alt="Logo Planilha de Gastos" class="brand-badge-logo">
                    </div>
                    <h1 class="brand-title" id="brand-title"></h1>
                    <p class="brand-subtitle" id="brand-subtitle">Sistema de Gestão Financeira Inteligente</p>
                </div>

                <div class="view-stack">
                    <div id="login-view" class="view">
                        <div class="input-group" id="field-email">
                            <label for="login-email">Email</label>
                            <div class="input-wrap">
                                <i class="fas fa-envelope"></i>
                                <input type="email" id="login-email" placeholder="seu@email.com" autocomplete="email">
                            </div>
                        </div>
                        <div class="input-group" id="field-password">
                            <label for="login-password">Senha</label>
                            <div class="input-wrap">
                                <i class="fas fa-lock"></i>
                                <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password">
                            </div>
                        </div>

                        <button id="login-btn" class="btn-login">
                            <span class="btn-text">Entrar</span>
                            <div class="btn-spinner"></div>
                        </button>
                        <p id="login-error" class="error-msg"></p>
                    </div>

                    <div id="signup-view" class="view hidden">
                        <div class="input-group">
                            <label for="signup-name">Nome completo</label>
                            <div class="input-wrap">
                                <i class="fas fa-user"></i>
                                <input type="text" id="signup-name" placeholder="Como podemos te chamar?" autocomplete="name">
                            </div>
                        </div>
                        <div class="input-group">
                            <label for="signup-email">Email</label>
                            <div class="input-wrap">
                                <i class="fas fa-envelope"></i>
                                <input type="email" id="signup-email" placeholder="seu@email.com" autocomplete="email">
                            </div>
                        </div>
                        <div class="input-group">
                            <label for="signup-password">Senha</label>
                            <div class="input-wrap">
                                <i class="fas fa-lock"></i>
                                <input type="password" id="signup-password" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
                            </div>
                        </div>

                        <button id="signup-btn" class="btn-login">
                            <span class="btn-text">Criar Conta</span>
                            <div class="btn-spinner"></div>
                        </button>
                        <p id="signup-error" class="error-msg"></p>
                    </div>
                </div>

                <div class="toggle-link-area">
                    <a href="#" id="toggle-view-link">Não tem uma conta? <strong>Cadastre-se</strong></a>
                </div>

                <div class="separator">
                    <div class="separator-line"></div>
                    <span>ou</span>
                    <div class="separator-line"></div>
                </div>

                <button id="google-login-btn" class="btn-google">
                    <i class="fab fa-google google-icon"></i>
                    Entrar com Google
                </button>

                <div class="login-footer">
                    <span>&copy; 2026 Finanças</span>
                </div>
            </div>
        </div>
    </div>

    <div id="login-transition-overlay" aria-hidden="true"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/TextPlugin.min.js"></script>
    <script>
        (function () {
            gsap.registerPlugin(TextPlugin);

            const card = document.getElementById('login-card');
            const scene = document.getElementById('scene');
            const brandTitle = document.getElementById('brand-title');
            const brandBadge = document.getElementById('brand-badge');
            const loginView = document.getElementById('login-view');
            const signupView = document.getElementById('signup-view');
            const toggleLink = document.getElementById('toggle-view-link');
            const overlay = document.getElementById('login-transition-overlay');
            const allPrimaryBtns = () => [
                document.getElementById('login-btn'),
                document.getElementById('signup-btn'),
                document.getElementById('google-login-btn')
            ].filter(Boolean);

            // Intro states
            gsap.set(card, { opacity: 0, y: 36, scale: 0.93, rotateX: 9 });
            gsap.set('.brand, .view, .toggle-link-area, .separator, #google-login-btn, .login-footer', { opacity: 0, y: 16 });
            gsap.set('.orb', { opacity: 0, scale: 0.8 });
            gsap.set('.grid-overlay, .scan-overlay', { opacity: 0 });

            const tl = gsap.timeline({ delay: 0.12 });
            tl.to('.orb', { opacity: 0.65, scale: 1, duration: 1.2, stagger: 0.12, ease: 'power3.out' })
              .to('.grid-overlay', { opacity: 0.35, duration: 1 }, '-=1.0')
              .to('.scan-overlay', { opacity: 1, duration: 0.9 }, '-=0.8')
              .to(card, { opacity: 1, y: 0, scale: 1, rotateX: 0, duration: 1.1, ease: 'expo.out' }, '-=0.6')
              .to('.brand', { opacity: 1, y: 0, duration: 0.55, ease: 'power3.out' }, '-=0.4')
              .to('.view', { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, '-=0.35')
              .to(['.toggle-link-area', '.separator', '#google-login-btn', '.login-footer'], {
                  opacity: 1, y: 0, duration: 0.45, stagger: 0.08, ease: 'power3.out'
              }, '-=0.2');

            tl.to(brandTitle, {
                text: { value: 'Bem-vindo de volta', delimiter: '' },
                duration: 1.05,
                ease: 'none'
            }, '<+0.08');

            // Ambient movement
            gsap.to('.orb-1', { x: 26, y: -18, duration: 13, repeat: -1, yoyo: true, ease: 'sine.inOut' });
            gsap.to('.orb-2', { x: -22, y: 16, duration: 14, repeat: -1, yoyo: true, ease: 'sine.inOut' });
            gsap.to('.orb-3', { y: 22, scale: 1.05, duration: 11.5, repeat: -1, yoyo: true, ease: 'sine.inOut' });
            gsap.to('.scan-overlay', { backgroundPositionY: '26px', duration: 1.45, repeat: -1, ease: 'none' });

            // Mouse parallax + gentle tilt
            let pointerX = 0;
            let pointerY = 0;
            window.addEventListener('mousemove', (e) => {
                const xNorm = (e.clientX / window.innerWidth) - 0.5;
                const yNorm = (e.clientY / window.innerHeight) - 0.5;
                pointerX = xNorm;
                pointerY = yNorm;

                gsap.to(scene, { x: xNorm * -14, y: yNorm * -10, duration: 1, ease: 'power2.out' });
                gsap.to(card, {
                    rotateY: xNorm * 6,
                    rotateX: yNorm * -6,
                    transformPerspective: 1000,
                    transformOrigin: 'center center',
                    duration: 0.8,
                    ease: 'power2.out'
                });
            });

            window.addEventListener('mouseleave', () => {
                gsap.to(scene, { x: 0, y: 0, duration: 0.9, ease: 'power2.out' });
                gsap.to(card, { rotateX: 0, rotateY: 0, duration: 0.9, ease: 'power2.out' });
            });

            // Magnetic buttons
            function enableMagnet(el, power = 10) {
                if (!el) return;
                el.addEventListener('mousemove', (event) => {
                    const rect = el.getBoundingClientRect();
                    const x = event.clientX - rect.left - rect.width / 2;
                    const y = event.clientY - rect.top - rect.height / 2;
                    gsap.to(el, { x: x / power, y: y / power, duration: 0.28, ease: 'power2.out' });
                });
                el.addEventListener('mouseleave', () => {
                    gsap.to(el, { x: 0, y: 0, duration: 0.35, ease: 'power2.out' });
                });
            }
            allPrimaryBtns().forEach(btn => enableMagnet(btn));

            // Shine sweep on primary action buttons
            function buttonSweep(btn) {
                if (!btn) return;
                btn.addEventListener('mouseenter', () => {
                    gsap.fromTo(btn, { '--dummy': 0 }, {
                        duration: 0.65,
                        onStart: () => {
                            const pseudo = btn;
                            gsap.fromTo(pseudo, { }, {
                                duration: 0.65,
                                onUpdate: function () {
                                    const progress = this.progress();
                                    const pos = -120 + progress * 260;
                                    btn.style.setProperty('--sweep-x', pos + '%');
                                }
                            });
                        }
                    });
                    const before = getComputedStyle(btn, '::before');
                    if (before) {
                        btn.style.setProperty('--sweep-x', '-120%');
                        gsap.to(btn, {
                            duration: 0.6,
                            onUpdate: function () {
                                const p = this.progress();
                                btn.style.setProperty('--sweep-x', `${-120 + p * 240}%`);
                            }
                        });
                    }
                });
            }
            [document.getElementById('login-btn'), document.getElementById('signup-btn')].forEach(buttonSweep);

            // Improve button pseudo sweep CSS var
            document.querySelectorAll('.btn-login').forEach((btn) => {
                btn.style.setProperty('--sweep-x', '-120%');
                const style = document.createElement('style');
                style.textContent = `.btn-login::before{left:var(--sweep-x,-120%);}`;
                document.head.appendChild(style);
            });

            // Animated view change (works with auth.js toggling classes)
            function animateCurrentView() {
                const activeView = loginView.classList.contains('hidden') ? signupView : loginView;
                const fields = activeView.querySelectorAll('.input-group, .btn-login, .error-msg');
                gsap.fromTo(fields,
                    { opacity: 0, y: 14, filter: 'blur(5px)' },
                    { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.44, stagger: 0.06, ease: 'power3.out' }
                );

                gsap.to(brandTitle, {
                    text: {
                        value: activeView === signupView ? 'Crie sua conta' : 'Bem-vindo de volta',
                        delimiter: ''
                    },
                    duration: 0.55,
                    ease: 'none'
                });

                gsap.to(brandBadge, {
                    rotate: activeView === signupView ? 14 : 0,
                    scale: activeView === signupView ? 1.08 : 1,
                    duration: 0.42,
                    ease: 'back.out(1.8)'
                });
            }

            if (toggleLink) {
                toggleLink.addEventListener('click', () => {
                    setTimeout(animateCurrentView, 40);
                });
            }

            // Input focus pulse
            document.querySelectorAll('.input-wrap input').forEach((input) => {
                input.addEventListener('focus', () => {
                    gsap.fromTo(input, { boxShadow: '0 0 0 0 rgba(79,124,255,0.0)' }, {
                        boxShadow: '0 0 0 4px rgba(79,124,255,0.14)',
                        duration: 0.28,
                        ease: 'power2.out'
                    });
                });
            });

            // Particle field
            const canvas = document.getElementById('bg-particles');
            const ctx = canvas.getContext('2d');
            const particles = [];
            const total = 72;

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            for (let i = 0; i < total; i += 1) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 0.45,
                    vy: (Math.random() - 0.5) * 0.45,
                    r: Math.random() * 1.8 + 0.5,
                    o: Math.random() * 0.55 + 0.15
                });
            }

            function drawParticles() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                for (let i = 0; i < particles.length; i += 1) {
                    const p = particles[i];
                    p.x += p.vx + pointerX * 0.22;
                    p.y += p.vy + pointerY * 0.22;

                    if (p.x < -20) p.x = canvas.width + 20;
                    if (p.x > canvas.width + 20) p.x = -20;
                    if (p.y < -20) p.y = canvas.height + 20;
                    if (p.y > canvas.height + 20) p.y = -20;

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(146, 185, 255, ${p.o})`;
                    ctx.fill();
                }

                for (let i = 0; i < particles.length; i += 1) {
                    for (let j = i + 1; j < particles.length; j += 1) {
                        const a = particles[i];
                        const b = particles[j];
                        const dx = a.x - b.x;
                        const dy = a.y - b.y;
                        const d = Math.hypot(dx, dy);
                        if (d < 120) {
                            ctx.beginPath();
                            ctx.moveTo(a.x, a.y);
                            ctx.lineTo(b.x, b.y);
                            ctx.strokeStyle = `rgba(123, 162, 255, ${0.08 * (1 - d / 120)})`;
                            ctx.lineWidth = 1;
                            ctx.stroke();
                        }
                    }
                }

                requestAnimationFrame(drawParticles);
            }
            drawParticles();

            // Global success transition called by auth.js hook
            window.playLoginSuccessTransition = function (onComplete) {
                const activeView = loginView.classList.contains('hidden') ? signupView : loginView;
                const activeFields = activeView.querySelectorAll('.input-group, .btn-login, .error-msg');

                const out = gsap.timeline({ onComplete });
                out.to(activeFields, { opacity: 0, y: -18, duration: 0.24, stagger: 0.03, ease: 'power2.in' })
                   .to(card, {
                       scale: 1.08,
                       opacity: 0,
                       rotateX: 11,
                       filter: 'blur(10px)',
                       duration: 0.52,
                       ease: 'power3.in'
                   }, '-=0.03')
                   .to('#login-transition-overlay', { opacity: 1, duration: 0.56, ease: 'power3.inOut' }, '-=0.25');
            };
        }());
    </script>
